<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Моё PWA</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  
  <!-- iOS PWA поддержка -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MyPWA">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
  <h1>Привет, PWA! 📱</h1>
  <p>Приложение работает из подпапки <code>/wapp/</code></p>
  <button id="installBtn" style="display:none;">📲 Установить приложение</button>

  <script>
    // Регистрация SW относительно текущей директории
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('✅ SW зарегистрирован. Scope:', reg.scope))
          .catch(err => console.error('❌ Ошибка SW:', err));
      });
    }

    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
    });

    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      console.log(`Пользователь ${outcome === 'accepted' ? 'установил' : 'отменил'}`);
      deferredPrompt = null;
      installBtn.style.display = 'none';
    });
  </script>
</body>
</html>
